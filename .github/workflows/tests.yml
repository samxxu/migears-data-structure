name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']

    name: PHP ${{ matrix.php }}

    # The unit suite mocks the client, but the integration suite needs a server:
    # RedisTestCase marks itself skipped when it cannot reach one. Without this
    # service the 36 integration tests would vanish from CI instead of failing,
    # leaving zRange/expire/persist and the lock expiry with no real coverage.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: redis
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Static analysis
        run: vendor/bin/phpstan analyse --no-progress

      # RedisTestCase marks the integration half skipped when no server answers,
      # and a skipped test still exits 0, so without the flag a service
      # container that failed to start would leave the build green while the
      # integration half ran nothing. The service makes the tests able to run;
      # the flag is what makes a skip visible.
      - name: Tests
        env:
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: '6379'
        run: vendor/bin/phpunit --fail-on-skipped
