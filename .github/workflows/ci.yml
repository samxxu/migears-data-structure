name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']

    name: PHP ${{ matrix.php }}

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # Integration tests reach the service container through ext-redis.
          extensions: redis
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      # Level 6 is the module's own bar (phpstan.neon); running it here is what
      # keeps that bar true in CI and not just on a maintainer's machine.
      - name: Static analysis
        run: vendor/bin/phpstan analyse --no-progress

      - name: Unit tests (stubbed connection)
        run: composer test:unit

      # RedisTestCase skips itself when no server answers, and a skip still
      # exits 0 — without the flag the whole integration half could be
      # reported as passing while running nothing.
      - name: Integration tests (Redis via service container)
        env:
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: '6379'
        run: composer test:integration -- --fail-on-skipped
